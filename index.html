<style>
canvas, img {
  image-rendering: pixelated;
  user-select: none;
}
#grid {
  width: 100%;
  display: grid;
  gap: 4px;
  justify-content: center;
  margin: 16px auto;
}
#grid > div {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 1px;
}
#grid > div div {
  font-size: 10px;
  line-height: 1;
  padding: 2px 0;
  margin-top: auto;
}
.controls {
  display: flex;
  width: 192px;
  margin: 0 auto;
  gap: 4px;
  height: 28px;
}
.controls button {
  height: 100%;
  aspect-ratio: 2;
  flex-shrink: 0;
}
.controls input {
  flex: 1;
  min-width: 0;
  width: 0;
  text-align: center;
}
</style>

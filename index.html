---
layout: default
---

<style>
canvas, img {
  image-rendering: pixelated;
  user-select: none;
}
#grid {
  width: 100%;
  display: grid;
  gap: 4px;
  justify-content: center;
  margin: 16px auto;
}
#grid > div {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 1px;
}
#grid > div div {
  font-size: 10px;
  line-height: 1;
  padding: 2px 0;
  margin-top: auto;
}
.controls {
  display: flex;
  width: 192px;
  margin: 0 auto;
  gap: 4px;
  height: 28px;
}
.controls button {
  height: 100%;
  aspect-ratio: 2;
  flex-shrink: 0;
}
.controls input {
  flex: 1;
  min-width: 0;
  width: 0;
  text-align: center;
}

@media (min-width: 513px) and (min-height: 513px) {
  .container {
    position: sticky;
    top: 14px;
  }
}

</style>

<h1>Life</h1>

Check the <a href="https://github.com/nxrix/life" target="_blank">GitHub repository</a> to learn more

<hr>

<div class="container" style="display:flex;flex-direction:column;gap:4px;width:fit-content;background:var(--c1);padding:4px;border:1px solid var(--c3);border-radius:8px">
  <canvas id="c1" style="border:1px solid var(--c3);border-radius:1px;"></canvas>
  <div style="display:flex;gap:2px">
    <input type="number" id="ruleInput" placeholder="Rule" style="flex:1;width:69px;padding-left:6px">
    <input type="text" id="ruleInput2" placeholder="B3/S23" style="flex:1;width:69px;padding-left:6px">
    <button id="random">🎲</button>
  </div>
  <div style="display:flex;gap:2px">
    <select id="type">
      <option value="0">2x2 - 62</option>
      <option value="1">2x2</option>
      <option value="2">Random</option>
    </select>
    <button id="reset">Reset</button>
    <button id="step">Step</button>
    <button id="play">Pause</button>
  </div>
</div>

<br>

<div class="controls" id="controls0">
  <button id="prev0"><</button>
  <input type="text" id="input0" placeholder="Page">
  <button id="next0">></button>
</div>
<div id="grid"></div>
<div class="controls" id="controls1">
  <button id="prev1"><</button>
  <input type="text" id="input1" placeholder="Page">
  <button id="next1">></button>
</div>

<script type="module" src="./main.js"></script>
